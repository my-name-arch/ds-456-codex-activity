<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="355" viewBox="0 0 1050 355">
<title>Distance by vehicle</title>
<desc>Lines show the 25th to 75th percentile; dots show medians. Valid long trips are retained.</desc>
<rect width="100%" height="100%" fill="white"/>
<g font-family="sans-serif" fill="#172b4d">
<text x="24" y="32" font-size="23">Distance by vehicle</text>
<text x="24" y="58" font-size="14">Full CSV; streets and trails; dot = median; line = middle 50% of recorded trips</text>
<line x1="220.00" x2="220.00" y1="85" y2="245" stroke="#e2e8f0"/>
<text x="220.00" y="268" text-anchor="middle" font-size="13">0.00</text>
<line x1="356.00" x2="356.00" y1="85" y2="245" stroke="#e2e8f0"/>
<text x="356.00" y="268" text-anchor="middle" font-size="13">0.87</text>
<line x1="492.00" x2="492.00" y1="85" y2="245" stroke="#e2e8f0"/>
<text x="492.00" y="268" text-anchor="middle" font-size="13">1.75</text>
<line x1="628.00" x2="628.00" y1="85" y2="245" stroke="#e2e8f0"/>
<text x="628.00" y="268" text-anchor="middle" font-size="13">2.62</text>
<line x1="764.00" x2="764.00" y1="85" y2="245" stroke="#e2e8f0"/>
<text x="764.00" y="268" text-anchor="middle" font-size="13">3.50</text>
<line x1="900.00" x2="900.00" y1="85" y2="245" stroke="#e2e8f0"/>
<text x="900.00" y="268" text-anchor="middle" font-size="13">4.37</text>
<text x="24" y="122" font-size="16">Scooter</text>
<text x="24" y="143" font-size="13">valid n = 778,738</text>
<line x1="345.62" x2="632.00" y1="122" y2="122" stroke="#276fbf" stroke-width="9"/>
<circle cx="449.94" cy="122" r="7" fill="#172b4d"/>
<text x="449.94" y="151" text-anchor="middle" font-size="13">median 1.48; middle 50% 0.81–2.65</text>
<text x="24" y="215" font-size="16">E-bike (bicycle)</text>
<text x="24" y="236" font-size="13">valid n = 245,276</text>
<line x1="368.48" x2="764.00" y1="215" y2="215" stroke="#276fbf" stroke-width="9"/>
<circle cx="509.02" cy="215" r="7" fill="#172b4d"/>
<text x="509.02" y="244" text-anchor="middle" font-size="13">median 1.86; middle 50% 0.95–3.50</text>
<text x="560" y="298" text-anchor="middle" font-size="15">Distance (kilometers); shared axis starts at zero</text>
<text x="24" y="330" font-size="13">Intervals describe trip variation, not uncertainty; tails are retained in calculations and extend beyond the intervals.</text>
</g></svg>
